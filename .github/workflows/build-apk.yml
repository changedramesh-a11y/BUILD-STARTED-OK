name: build-apk
run-name: ${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id: { required: true, type: string }
      app_url: { required: true, type: string }
      app_name: { required: true, type: string }
      package_name: { required: true, type: string }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Create Android project
        env:
          BUILD_ID: ${{ inputs.build_id }}
          APP_URL: ${{ inputs.app_url }}
          APP_NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package_name }}
        run: |
          python3 - <<'PY'
          import os, re, json, shutil, html
          e = os.environ
          pkg = e["PKG"]
          assert re.fullmatch(r"[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+", pkg)
          url = e["APP_URL"]; assert url.startswith("https://") or url.startswith("http://")
          name = html.escape(e["APP_NAME"]).replace("'", "\\'")
          host = re.sub(r"^https?://", "", url).split("/")[0]
          root = "app-src"; src = f"{root}/app/src/main"
          jdir = f"{src}/java/" + pkg.replace(".", "/")
          for d in [jdir, f"{src}/res/mipmap-xxxhdpi", f"{src}/res/values"]:
              os.makedirs(d, exist_ok=True)
          def w(p, s): open(p, "w").write(s)
          w(f"{root}/settings.gradle", """pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'webapp'
          include ':app'
          """)
          w(f"{root}/build.gradle", "plugins { id 'com.android.application' version '8.5.0' apply false }\n")
          w(f"{root}/gradle.properties", "android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n")
          w(f"{root}/app/build.gradle", f"""plugins {{ id 'com.android.application' }}
          android {{
            namespace '{pkg}'
            compileSdk 34
            defaultConfig {{ applicationId '{pkg}'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }}
            compileOptions {{ sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }}
          }}
          dependencies {{ implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0' }}
          """)
          w(f"{src}/AndroidManifest.xml", """<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="@string/app_name" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:usesCleartextTraffic="true" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          """)
          w(f"{src}/res/values/strings.xml", f'<resources><string name="app_name">{name}</string></resources>\n')
          shutil.copy(f"icons/{e['BUILD_ID']}.png", f"{src}/res/mipmap-xxxhdpi/ic_launcher.png")
          w(f"{jdir}/MainActivity.java", f"""package {pkg};
          import android.app.Activity; import android.content.Intent; import android.net.Uri; import android.os.Bundle;
          import android.webkit.*; import android.graphics.Bitmap; import androidx.swiperefreshlayout.widget.SwipeRefreshLayout;
          public class MainActivity extends Activity {{
            static final String START = {json.dumps(url)}; static final String HOST = {json.dumps(host)};
            WebView web; SwipeRefreshLayout swipe;
            static final String OFFLINE = "<html><body style='font-family:sans-serif;text-align:center;padding-top:40%'><h2>No internet</h2><p>Check your connection and pull down to retry.</p></body></html>";
            @Override protected void onCreate(Bundle b) {{
              super.onCreate(b);
              swipe = new SwipeRefreshLayout(this); web = new WebView(this); swipe.addView(web); setContentView(swipe);
              WebSettings s = web.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setDatabaseEnabled(true); s.setLoadWithOverviewMode(true); s.setUseWideViewPort(true);
              swipe.setOnRefreshListener(() -> {{ String u = web.getUrl(); if (u == null || u.startsWith("data:") || u.startsWith("about:")) web.loadUrl(START); else web.reload(); }});
              web.setWebChromeClient(new WebChromeClient());
              web.setWebViewClient(new WebViewClient() {{
                @Override public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {{
                  Uri u = r.getUrl(); String sc = u.getScheme();
                  if (("http".equals(sc) || "https".equals(sc))) return false;
                  try {{ startActivity(new Intent(Intent.ACTION_VIEW, u)); }} catch (Exception ex) {{}}
                  return true;
                }}
                @Override public void onPageFinished(WebView v, String u) {{ swipe.setRefreshing(false); }}
                @Override public void onReceivedError(WebView v, WebResourceRequest r, WebResourceError er) {{
                  if (r.isForMainFrame()) v.loadDataWithBaseURL(null, OFFLINE, "text/html", "utf-8", null);
                }}
              }});
              if (b != null) web.restoreState(b); else web.loadUrl(START);
            }}
            @Override protected void onSaveInstanceState(Bundle o) {{ super.onSaveInstanceState(o); web.saveState(o); }}
            @Override public void onBackPressed() {{ if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }}
          }}
          """)
          PY
      - name: Build APK
        working-directory: app-src
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
