      - name: Build Android APK
        if: inputs.target != 'windows' && !fromJSON(inputs.options || '{}').release
        working-directory: app-src
        run: gradle assembleDebug --no-daemon
      - name: Build Play Store release
        if: inputs.target != 'windows' && fromJSON(inputs.options || '{}').release
        working-directory: app-src
        shell: bash
        run: |
          KS_PASS=$(openssl rand -hex 16); export KS_PASS
          keytool -genkeypair -keystore app/release.jks -alias app -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=${{ inputs.package_name }}"
          gradle assembleRelease bundleRelease --no-daemon
          mkdir -p release-out
          cp app/build/outputs/apk/release/app-release.apk release-out/app-release.apk
          cp app/build/outputs/bundle/release/app-release.aab release-out/app-release.aab
          cp app/release.jks release-out/upload-key.jks
          printf 'Keep this folder safe. You need the same key for every Play Store update.\n\napp-release.aab  - upload this to Google Play Console\napp-release.apk  - install directly on phones\nupload-key.jks   - your signing key\nKey alias: app\nKey password: %s\nPackage: ${{ inputs.package_name }}\n' "$KS_PASS" > release-out/README.txt
      - name: Build Windows app
        if: inputs.target == 'windows'
        working-directory: app-src
        shell: bash
        run: |
          python -m pip install Pillow==11.3.0
          python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          npm install --no-audit --no-fund
          npx electron-packager . WebsiteApp --platform=win32 --arch=x64 --out=release --overwrite --icon=icon.ico
          python -c "import shutil; shutil.make_archive('windows-app', 'zip', 'release/WebsiteApp-win32-x64')"
      - uses: actions/upload-artifact@v4
        if: inputs.target != 'windows' && fromJSON(inputs.options || '{}').release
        with:
          name: release
          path: app-src/release-out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: inputs.target != 'windows' && !fromJSON(inputs.options || '{}').release
        with:
          name: apk
          path: app-src/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: inputs.target == 'windows'
        with:
          name: windows
          path: app-src/windows-app.zip
          retention-days: 7
